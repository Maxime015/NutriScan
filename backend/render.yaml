services:
  - type: web
    name: food-analyzer
    env: python
    # L'OCR est délégué à ocr.space (API HTTP) : pas besoin de tesseract côté serveur.
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: OCR_API_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
